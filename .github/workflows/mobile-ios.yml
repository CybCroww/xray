name: iOS core

on:
  push:
    branches: [app]
  pull_request:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcframework:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test client and packet flow
        run: >
          go test -race ./mobile ./proxy/tun ./common/retry
          ./transport/internet/grpc/... ./transport/internet/hysteria
          ./transport/internet/internal/quicconfig ./transport/internet/reality
          ./transport/internet/splithttp ./transport/internet/tcp ./transport/internet/websocket
      - name: Build iPhone and simulator framework
        run: |
          bash mobile/ios/build.sh
          ditto -c -k --keepParent build_assets/CVPNCore.xcframework build_assets/CVPNCore.zip
      - uses: actions/upload-artifact@v7
        with:
          name: CVPNCore-iOS
          path: build_assets/CVPNCore.zip
          if-no-files-found: error
          retention-days: 7
