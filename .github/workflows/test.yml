name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Prepare verified geodata
        uses: ./.github/actions/prepare-assets
      - name: Share geodata with test jobs
        uses: actions/upload-artifact@v7
        with:
          name: test-geodata
          path: resources
          if-no-files-found: error
          retention-days: 1

  check-proto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Check Proto Version Header
        run: |
          head -n 4 core/config.pb.go > ref.txt
          find . -name "*.pb.go" ! -name "*_grpc.pb.go" -print0 | while IFS= read -r -d '' file; do
            if ! cmp -s ref.txt <(head -n 4 "$file"); then
              echo "Error: Header mismatch in $file"
              head -n 4 "$file"
              exit 1
            fi
          done

  check-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./

  test:
    needs: check-assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download verified geodata
        uses: actions/download-artifact@v8
        with:
          name: test-geodata
          path: resources
      - name: Test
        shell: bash
        env:
          XRAY_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          go list ./... > "$RUNNER_TEMP/xray-packages.txt"
          packages=()
          while IFS= read -r package; do
            if [[ "$XRAY_BRANCH" == app && "$package" == github.com/xtls/xray-core/testing/scenarios ]]; then
              continue
            fi
            packages+=("$package")
          done < "$RUNNER_TEMP/xray-packages.txt"
          test "${#packages[@]}" -gt 0
          go test -timeout 1h -v "${packages[@]}"
      - name: Race test shared networking
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 20m ./app/dns/... ./app/proxyman/... ./transport/internet/tagged/... ./transport/internet/splithttp/... ./transport/internet/hysteria/... ./proxy/hysteria/...

  mobile-build:
    if: github.base_ref == 'app' || (github.base_ref == '' && github.ref_name == 'app')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOARCH: arm64
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build Android core
        env:
          GOOS: android
        run: go build -trimpath -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/xray-android-arm64" ./main
      - name: Compile iOS packages
        env:
          GOOS: ios
        run: go build ./core ./infra/conf/... ./proxy/... ./transport/...
