name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Prepare verified geodata
        uses: ./.github/actions/prepare-assets
      - name: Share geodata with test jobs
        uses: actions/upload-artifact@v7
        with:
          name: test-geodata
          path: resources
          if-no-files-found: error
          retention-days: 1

  check-format-and-proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check Protobuf
        run: go run ./infra/vprotogen/main.go -mode check -pwd ./

  test:
    needs: check-assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download verified geodata
        uses: actions/download-artifact@v8
        with:
          name: test-geodata
          path: resources
      - name: Test
        shell: bash
        env:
          XRAY_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          go list ./... > "$RUNNER_TEMP/xray-packages.txt"
          packages=()
          while IFS= read -r package; do
            if [[ "$XRAY_BRANCH" == app && "$package" == github.com/xtls/xray-core/testing/scenarios ]]; then
              continue
            fi
            packages+=("$package")
          done < "$RUNNER_TEMP/xray-packages.txt"
          test "${#packages[@]}" -gt 0
          go test -timeout 1h -v "${packages[@]}"
      - name: Race test shared networking
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout 20m ./app/dns/... ./app/proxyman/... ./transport/internet/tagged/... ./transport/internet/splithttp/... ./transport/internet/hysteria/... ./proxy/hysteria/...

  native-hysteria:
    if: github.ref_name == 'nodes-rust' || github.base_ref == 'nodes-rust'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CGO_ENABLED: 1
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build native engine and fixtures
        run: |
          cargo build --locked --release --features engine --bins --manifest-path native/libxhysteria/Cargo.toml
          bash native/libxhysteria/build-linux.sh
      - name: Test Rust engine
        run: cargo test --locked --release --features engine --lib --manifest-path native/libxhysteria/Cargo.toml
      - name: Test native integration and accounting
        env:
          XHYS_PROBE: ${{ github.workspace }}/native/libxhysteria/target/release/xhys-probe
          XHYS_ECHO: ${{ github.workspace }}/native/libxhysteria/target/release/xhys-echo
        run: |
          bash native/libxhysteria/link-go.sh native/libxhysteria/target/release objcopy \
            go test -race -tags 'xhysteria_native xhysteria_interop' ./native/libxhysteria/interop \
            -run '^(TestNativeServerUserLimitAndAccounting|TestEmbeddedNativeServer|TestEmbeddedNativeOutbound|TestGoOutboundAgainstEmbeddedServer|TestNativeServerDynamicUsers|TestNativeShortFlowsReturnQUICStreamCapacity|TestNativeSingleQUICSessionRecyclesClosedStreams)$' \
            -count=1 -timeout 5m
      - name: Upload native Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-native-linux-amd64
          path: build_assets/xray-native
          if-no-files-found: error
          retention-days: 7

  mobile-build:
    if: github.base_ref == 'app' || (github.base_ref == '' && github.ref_name == 'app')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOARCH: arm64
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build Android core
        env:
          GOOS: android
        run: go build -trimpath -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/xray-android-arm64" ./main
      - name: Compile iOS packages
        env:
          GOOS: ios
        run: go build ./core ./infra/conf/... ./proxy/... ./transport/...
